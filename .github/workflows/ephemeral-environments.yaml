name: Deploy & Cleanup Ephemeral Environments

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    types: [opened, synchronize, closed]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dynamic_region:
        description: 'Optional AWS region override'
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  # The deploy comments the environment URL on the pull request.
  pull-requests: write

env:
  # First non-empty wins: workflow input, repo variable, then the default.
  AWS_REGION: ${{ inputs.dynamic_region || vars.AWS_REGION || 'us-east-1' }}
  # Overrides the placeholder account in config.json, which is committed and deliberately fake.
  CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy:
    if: github.event_name != 'schedule' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: EphemeralDeployment
    # Supersede an in-flight deploy for the same environment: pushing twice quickly would otherwise
    # race on the stack and create two "environment is live" comments instead of editing one.
    concurrency:
      group: ephemeral-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck, Test & Synth
        run: make precheck

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Compute Environment Name
        id: names
        # Refs reach the script through the environment, never interpolated into it: a branch name
        # may contain quotes, and `'${{ ... }}'` in a run block would let it end the quoting.
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ENV_NAME=$(scripts/env-name.sh "$EVENT_NAME" "$SOURCE_REF" "$PR_NUMBER")
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying environment: $ENV_NAME"

      - name: Create or Update Ephemeral Env
        run: make cdk-deploy ENV='${{ steps.names.outputs.env_name }}'

      # The whole point of an ephemeral environment is the URL, so put it where the reviewer
      # already is instead of leaving it in the job log. One sticky comment, edited on each push.
      - name: Post Environment To PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ steps.names.outputs.env_name }}
        with:
          script: |
            const { readFileSync } = require('fs');
            const outputs = JSON.parse(readFileSync('cdk-outputs.json', 'utf8'));
            const [stack, values] = Object.entries(outputs)[0];

            // Anyone who can see the pull request can see this comment, so it carries the URL and
            // nothing else. Database endpoints, secret ARNs and role ARNs stay in the job summary,
            // which needs repository access to read.
            const body = [
              '<!-- ephemeral-env -->',
              `### 🚀 Environment \`${process.env.ENV_NAME}\` is live`,
              '',
              `**${values.LoadBalancerUrl}**`,
              '',
              `Stack \`${stack}\` in \`${process.env.AWS_REGION}\`. Redeployed on every push, destroyed when this PR closes.`,
              'Full outputs are in the [workflow run summary](' +
                `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}).`,
            ].join('\n');

            await require('./.github/scripts/sticky-comment.js')({ github, context, body });

      - name: Job Summary
        if: always() && steps.names.outputs.env_name != ''
        run: |
          {
            echo "### Environment \`${{ steps.names.outputs.env_name }}\`"
            echo
            if [ -f cdk-outputs.json ]; then
              jq -r 'to_entries[] | .value | to_entries[] | "- **\(.key)**: \(.value)"' cdk-outputs.json
            else
              echo "Deploy did not produce outputs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: EphemeralCleanup
    # Queues behind a deploy for the same environment rather than cancelling it — a half-deployed
    # stack still has to be destroyed. Never cancel-in-progress here.
    concurrency:
      group: ephemeral-${{ github.event.pull_request.number || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy This PR's Environment
        id: destroy
        if: github.event_name == 'pull_request'
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ENV_NAME=$(scripts/env-name.sh pull_request "$SOURCE_REF" "$PR_NUMBER")
          echo "Destroying environment: $ENV_NAME"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          make cdk-destroy ENV="$ENV_NAME"

      # Edits the same comment the deploy posted, so the PR never keeps a link to a dead URL.
      - name: Mark Environment Destroyed
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ steps.destroy.outputs.env_name }}
        with:
          script: |
            const body = [
              '<!-- ephemeral-env -->',
              `### 🧹 Environment \`${process.env.ENV_NAME}\` destroyed`,
              '',
              'Its resources were removed when this pull request closed.',
            ].join('\n');

            await require('./.github/scripts/sticky-comment.js')({ github, context, body });

      # Nightly sweep: ephemeral envs are capped at a day, so a stale one never outlives its PR.
      - name: Destroy All Ephemeral Environments
        if: github.event_name == 'schedule'
        run: |
          make list-envs | tee /dev/stderr | xargs -r -I{} aws cloudformation delete-stack --stack-name {}

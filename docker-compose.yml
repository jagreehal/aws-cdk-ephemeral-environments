# AWS Emulator: local AWS APIs on https://127.0.0.1:9297 — https://docs.aws.amazon.com/aws-emulator/
# Deploy this CDK app against it with `make local-deploy` (see the Makefile).
services:
  aws-emulator:
    build: ./emulator
    # Run as you, so the credentials it writes to ~/.aws/emulator are yours (AWS's Linux advice).
    user: '${EMULATOR_UID:-1000}:${EMULATOR_GID:-1000}'
    ports:
      - '127.0.0.1:9297:9297'
    # The emulator writes its credentials, config and CA cert under $HOME/.aws/emulator/<port>;
    # mounting that at the same path means the host's AWS CLI and SDKs can use them as-is.
    environment:
      HOME: ${HOME}
    volumes:
      - ${HOME}/.aws/emulator:${HOME}/.aws/emulator
    command: ['-p', '9297', '--telemetry', 'off']
    healthcheck:
      test: ['CMD', 'curl', '-fsk', 'https://127.0.0.1:9297/__admin/health']
      interval: 5s
      timeout: 3s
      retries: 12
